name: CI

# This repo is the playbook itself (docs + shell/PowerShell scripts + CI/CD
# templates), not an application — so this pipeline validates the tooling
# other repos will copy, instead of the generic backend/frontend template in
# pipelines/github/ci.yml (that one is for consumers, not for this repo).
#
# Stages: lint (markdown/yaml/json) -> validate (shellcheck/PSScriptAnalyzer/
# actionlint) -> self-audit (dogfood audit/run-audit.sh against this repo).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Markdown lint ────────────────────────────────────────────────────────
  markdown-lint:
    name: lint-markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: "**/*.md"

  # ── YAML validity + GitHub Actions schema check ─────────────────────────
  yaml-lint:
    name: lint-yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: yamllint (all YAML files)
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable
              truthy:
                allowed-values: ["true", "false", "on"]
              comments-indentation: disable
              comments:
                min-spaces-from-content: 1

      - name: actionlint (GitHub Actions workflow shape)
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # Real, active workflows for this repo:
          ./actionlint .github/workflows/*.yml
          # Consumer templates: same schema, just not wired to *this* repo's
          # branches/vars, so lint them independently.
          ./actionlint pipelines/github/ci.yml pipelines/github/cd.yml pipelines/github/release.yml

  # ── JSON validity ─────────────────────────────────────────────────────────
  json-lint:
    name: lint-json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate every tracked *.json parses
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; status=1; }
          done < <(git ls-files -z -- '*.json')
          exit $status

  # ── Shell scripts (audit/*.sh) ───────────────────────────────────────────
  shellcheck:
    name: lint-shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          additional_files: "scanner/deep-scan.sh"
          scandir: "./audit"
          severity: warning

  # ── PowerShell scripts (audit/*.ps1) ────────────────────────────────────
  psscriptanalyzer:
    name: lint-powershell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Get-ChildItem -Path ./audit, ./scanner -Filter *.ps1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error }
          $results | Format-Table -AutoSize
          $blocking = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($blocking) {
            Write-Host "::error::PSScriptAnalyzer found Error-severity issues"
            exit 1
          }

  # ── Scan engine embedded in index.html ──────────────────────────────────
  test-engine:
    name: test-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Engine unit tests
        run: node --test tests/engine.test.mjs

  # ── Deep scan end to end, on the systems Windows development cannot reach ──
  test-deep-scan:
    name: test-deep-scan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run scanner/deep-scan.sh against this repo
        run: |
          bash scanner/deep-scan.sh .
          cat .devsec/status.json
          grep -q '"phase":"done"' .devsec/status.json
          ! grep -q '"state":"failed"' .devsec/status.json

  # ── Self-audit: dogfood the tool against this repo ──────────────────────
  self-audit:
    name: self-audit
    runs-on: ubuntu-latest
    needs: [markdown-lint, yaml-lint, json-lint, shellcheck, psscriptanalyzer, test-engine, test-deep-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not the default shallow depth-1 clone — G-04 in
          # run-audit.sh scans `git log --all` for secret-like filenames ever
          # committed. A shallow clone would make it silently WARN/skip
          # instead of actually checking anything.
          fetch-depth: 0
      - name: Run audit/run-audit.sh against this repo
        run: |
          chmod +x audit/run-audit.sh
          bash audit/run-audit.sh .
          # Exit code is 0 unless the verdict is CRITICAL — see audit/README.md.
      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: self-audit-reports
          path: audit/reports/
          retention-days: 30
