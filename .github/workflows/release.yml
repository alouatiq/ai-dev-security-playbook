name: release

# Automated versioning for the playbook itself. On every push to main,
# release-please reads Conventional Commit messages since the last release
# and opens/updates a standing "release PR" that bumps the version and
# updates CHANGELOG.md. Merging that PR cuts the release: tags vX.Y.Z and
# publishes a GitHub Release.
#
#   feat:                      -> MINOR
#   fix: / perf:               -> PATCH
#   feat!: / BREAKING CHANGE   -> MAJOR
#
# See ../../docs/RELEASE_GUIDE.md for the full convention.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
