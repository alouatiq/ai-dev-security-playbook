name: CI

# Generic CI pipeline: lint -> build -> test -> security scan -> quality gate.
# Adjust the env vars below to match your project layout; the rest of the
# pipeline should not need edits for most Python-backend / Node-frontend repos.
#
# Runs on every push to feature branches. Pushes directly to the default
# branch should be blocked at the repo settings level — only merges via a
# reviewed PR are allowed.
on:
  push:
    branches-ignore:
      - main

env:
  BACKEND_DIR: backend          # set to "" if there is no Python backend
  FRONTEND_DIR: frontend        # set to "" if there is no Node frontend
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  COVERAGE_THRESHOLD: 80
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Stage 1 — Lint (fail fast) ─────────────────────────────────────────────

  lint-backend:
    name: lint-backend
    runs-on: ubuntu-latest
    if: vars.BACKEND_DIR != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff lint
        working-directory: ${{ env.BACKEND_DIR }}
        run: ruff check .
      - name: Ruff format check
        working-directory: ${{ env.BACKEND_DIR }}
        run: ruff format --check .

  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest
    if: vars.FRONTEND_DIR != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci
      - name: Lint (ESLint)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

  # ── Stage 2 — Build ────────────────────────────────────────────────────────

  build-backend:
    name: build-backend
    runs-on: ubuntu-latest
    needs: [lint-backend]
    if: vars.BACKEND_DIR != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install -r requirements-dev.txt || pip install -r requirements.txt
      - name: Verify app imports cleanly
        working-directory: ${{ env.BACKEND_DIR }}
        run: python -c "import app.main" || echo "Adjust import target for your project"

  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    if: vars.FRONTEND_DIR != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci
      - name: Type-check
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx tsc --noEmit || true
      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist/

  # ── Stage 3 — Tests ────────────────────────────────────────────────────────

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: vars.BACKEND_DIR != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install -r requirements-dev.txt || pip install -r requirements.txt
      - name: Run tests with coverage
        working-directory: ${{ env.BACKEND_DIR }}
        run: pytest --cov=. --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: ${{ env.BACKEND_DIR }}/coverage.xml

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: [build-frontend]
    if: vars.FRONTEND_DIR != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci
      - name: Run tests with coverage
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: ${{ env.FRONTEND_DIR }}/coverage/lcov.info

  # ── Stage 3b — Security scanning ──────────────────────────────────────────

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, not the default shallow depth-1 clone — gitleaks-action
          # below scans commit history, and a shallow clone silently limits it
          # to the single commit being tested (looks clean, isn't actually
          # checking anything). Same gap the audit script's history check
          # below needs full depth for too.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: pip-audit (Python CVEs)
        if: vars.BACKEND_DIR != ''
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install pip-audit && pip-audit -r requirements.txt

      - name: npm audit (JS CVEs)
        if: vars.FRONTEND_DIR != ''
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --audit-level=high

      - name: Bandit (Python SAST)
        if: vars.BACKEND_DIR != ''
        working-directory: ${{ env.BACKEND_DIR }}
        run: pip install bandit && bandit -r . -ll

      - name: Semgrep (SAST, OWASP Top 10)
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/typescript
            p/owasp-top-ten

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 4 — Quality gate ─────────────────────────────────────────────────

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Enforce backend coverage threshold
        if: vars.BACKEND_DIR != ''
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          pip install -r requirements-dev.txt || pip install -r requirements.txt
          pytest --cov=. --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} --no-header -q
